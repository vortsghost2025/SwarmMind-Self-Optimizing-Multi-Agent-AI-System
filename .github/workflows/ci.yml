name: SwarmMind CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lane-worker-and-executor-tests:
    runs-on: ubuntu-latest
    env:
      LANE_REGISTRY_PATH: ${{ github.workspace }}/Archivist-Agent/.global/lane-registry.json
      LANE_REPOS_ROOT: ${{ github.workspace }}
      KERNEL_ROOT: ${{ github.workspace }}/kernel-lane
    defaults:
      run:
        working-directory: ./SwarmMind
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: SwarmMind

      - name: Checkout canonical Archivist-Agent
        uses: actions/checkout@v4
        with:
          repository: vortsghost2025/Archivist-Agent
          path: Archivist-Agent

      - name: Checkout kernel-lane
        uses: actions/checkout@v4
        with:
          repository: vortsghost2025/kernel-lane
          path: kernel-lane

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lane Worker WE4FREE + Remediation Tests
        run: node scripts/test-lane-worker-we4free.js

      - name: Executor v3 Golden Tests
        run: node scripts/test-executor-v3.js
